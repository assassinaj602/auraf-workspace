name: auraf
description: Core engine and runtime optimizer for AURAF (Adaptive Unified Runtime Architecture for Flutter).
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  test: ^1.24.0

flutter:
  plugin:
    platforms:
      android:
        package: com.auraf.telemetry
        pluginClass: AurafTelemetryPlugin
  assets:
    - assets/prompts.json
